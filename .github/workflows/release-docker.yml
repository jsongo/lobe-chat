name: Publish Docker Image
permissions:
  contents: read

on:
  push:
    branches:
      - next
      - performance
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: jsongo/lobe-chat-database

jobs:
  build:
    strategy:
      matrix:
        include:
          # - platform: linux/amd64
          #   os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.platform }} Image
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout base
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        # Use npm for better Docker compatibility (no symlinks)
        run: npm install

      - name: Build Next.js App
        env:
          # Use a dummy secret for build (must be at least 32 chars for BetterAuth)
          AUTH_SECRET: "ci-build-time-secret-12345678901234567890123456789012"
          # Database encryption key (must be at least 32 chars)
          KEY_VAULTS_SECRET: "ci-build-key-vaults-secret-1234567890123456789012345678"
          # Database configuration (dummy values for build)
          DATABASE_DRIVER: "node"
          DATABASE_URL: "postgres://postgres:password@localhost:5432/postgres"
          APP_URL: "http://localhost:3210"
          NEXT_PUBLIC_AUTH_URL: "http://localhost:3210"
          NEXT_PUBLIC_ENABLE_CLERK_AUTH: "0"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ""
          # Ensure standalone output
          NODE_OPTIONS: "--max-old-space-size=6144"
          DOCKER: "true"
        run: |
          # Use build:docker script which includes recovery logic
          npm run build:docker

      - name: Prepare Docker Context
        run: |
          # 1. Create a clean production output directory
          mkdir -p out

          # 2. Copy build artifacts into 'out'
          cp -r .next/standalone/. out/
          mkdir -p out/.next/static
          cp -r .next/static/. out/.next/static/
          cp -r public/. out/public/

          # 3. Handle dependencies for production
          # We copy the already installed node_modules (which are flat in npm)
          # then prune devDependencies
          cp -r node_modules out/
          cd out
          npm prune --production

          # 4. Fix sharp for the target architecture
          if [ "${{ matrix.platform }}" = "linux/arm64" ]; then
            npm install --os=linux --cpu=arm64 sharp
          fi

          # 5. Copy migrations and other scripts into 'out'
          cd ..
          mkdir -p out/migrations
          cp -r packages/database/migrations/. out/migrations/
          cp scripts/migrateServerDB/docker.cjs out/
          cp scripts/migrateServerDB/errorHint.js out/
          cp scripts/serverLauncher/startServer.js out/

          # 6. Final cleanup of Docker context
          # Create a minimal .dockerignore for the final step
          echo "*" > .dockerignore
          echo "!out" >> .dockerignore
          echo "!Dockerfile.ci" >> .dockerignore

          # Ensure patches directory exists
          mkdir -p patches

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Get commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and export
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          context: .
          file: ./Dockerfile.ci
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SHA=${{ steps.vars.outputs.sha_short }}
            USE_CN_MIRROR=false
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          rm -rf /tmp/digests
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download digests
        uses: actions/download-artifact@v6
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}
