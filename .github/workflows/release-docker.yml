name: Publish Docker Image
permissions:
  contents: read

on:
  push:
    branches:
      - next
      - performance
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: jsongo/lobe-chat-database

jobs:
  build:
    strategy:
      matrix:
        include:
          # - platform: linux/amd64
          #   os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.platform }} Image
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout base
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js App
        env:
          # Use a dummy secret for build (must be at least 32 chars for BetterAuth)
          AUTH_SECRET: "ci-build-time-secret-12345678901234567890123456789012"
          # Database encryption key (must be at least 32 chars)
          KEY_VAULTS_SECRET: "ci-build-key-vaults-secret-1234567890123456789012345678"
          # Database configuration (dummy values for build)
          DATABASE_DRIVER: "node"
          DATABASE_URL: "postgres://postgres:password@localhost:5432/postgres"
          APP_URL: "http://localhost:3210"
          NEXT_PUBLIC_AUTH_URL: "http://localhost:3210"
          NEXT_PUBLIC_ENABLE_CLERK_AUTH: "0"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ""
          # Ensure standalone output
          NODE_OPTIONS: "--max-old-space-size=6144"
          DOCKER: "true"
        run: |
          # Use build:docker script which includes recovery logic
          pnpm run build:docker

      - name: Prepare Docker Context
        run: |
          # 1. Create a clean 'out' directory
          mkdir -p out

          # 2. Copy build artifacts FIRST (including standalone base)
          # standalone includes its own minimal node_modules and server.js
          cp -r .next/standalone/. out/

          # IMPORTANT: Perform a deep sync of the .next directory
          # The standalone output often misses critical metadata files (manifests)
          # and chunks needed for runtime. We sync everything EXCEPT the cache.
          echo "Syncing full .next metadata and chunks into standalone..."
          mkdir -p out/.next/server
          # Copy contents of .next into out/.next, avoiding overwriting with empty dirs
          cp -r .next/server/. out/.next/server/ 2>/dev/null || true
          cp .next/*.json out/.next/ 2>/dev/null || true

          # FIX: Handle entry points if package.json has type:module
          # If server.js is CJS but package.json is ESM, we might need to rename it
          # However, Next.js standalone server.js is usually compatible or we can use --input-type
          # A safer way is to ensure all .js in .next/server are treated as ESM if they contain 'export'
          echo '{"type": "module"}' > out/.next/server/package.json

          # Static assets
          mkdir -p out/.next/static
          cp -r .next/static/. out/.next/static/
          cp -r public/. out/public/

          # 3. Prepare merged package.json for npm
          # We use our script to flatten and strip local workspace deps
          node scripts/prepare-npm-pkg.mjs
          cp package.json.npm out/package.json

          # 4. Install/Update production dependencies in the final directory
          # This ensures that any missing prod deps (like pg or sharp) are present
          cd out
          echo "registry=https://registry.npmjs.org/" > .npmrc
          # Explicitly include sharp and canvas polyfills for PDF/image processing
          npm install sharp @napi-rs/canvas --omit=dev --no-package-lock --legacy-peer-deps --no-audit --no-fund

          # 5. FORCE SHARP ARM64 BINARIES
          if [ "${{ matrix.platform }}" = "linux/arm64" ]; then
            npm install @img/sharp-linux-arm64 --no-save --force --legacy-peer-deps
            # Verify sharp binaries are present
            if [ ! -d "node_modules/@img/sharp-linux-arm64" ]; then
              echo "❌ Error: @img/sharp-linux-arm64 was not installed correctly!"
              exit 1
            fi
          fi

          # 6. Cleanup build-only files in 'out'
          rm -f .npmrc package.json.npm

          cd ..

          # 7. Handle migrations and scripts
          mkdir -p out/migrations
          cp -r packages/database/migrations/. out/migrations/
          cp scripts/migrateServerDB/docker.cjs out/
          cp scripts/migrateServerDB/errorHint.js out/
          cp scripts/serverLauncher/startServer.js out/

          # 7. Final cleanup of Docker context
          echo "*" > .dockerignore
          echo "!out" >> .dockerignore
          echo "!Dockerfile.ci" >> .dockerignore

          # Ensure patches directory exists
          mkdir -p patches

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Get commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and export
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          context: .
          file: ./Dockerfile.ci
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SHA=${{ steps.vars.outputs.sha_short }}
            USE_CN_MIRROR=false
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          rm -rf /tmp/digests
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download digests
        uses: actions/download-artifact@v6
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}
